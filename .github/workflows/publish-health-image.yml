name: Publish lightweight health image

on:
  push:
    branches: [main]
    paths:
      - "health-image/**"
      - ".github/workflows/publish-health-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-health-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate source
        run: |
          bash -n health-image/entrypoint.sh health-image/test_static.sh
          python3 -m py_compile health-image/health_server.py
          bash health-image/test_static.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: health-image
          file: health-image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/aryedu110-cmd/arye-vast-mobile-ai-stack:health-v1
            ghcr.io/aryedu110-cmd/arye-vast-mobile-ai-stack:health-latest
          cache-from: type=gha,scope=health-image
          cache-to: type=gha,mode=max,scope=health-image
          provenance: true
          sbom: true
