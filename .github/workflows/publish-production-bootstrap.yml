name: Publish production bootstrap image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'production-bootstrap/**'
      - '.github/workflows/publish-production-bootstrap.yml'

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static tests
        run: bash production-bootstrap/test_static.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: production-bootstrap
          file: production-bootstrap/Dockerfile
          push: true
          tags: |
            ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-11
            ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-10
            ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-9
            ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-8
            ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-7
            ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-6
            ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-4
            ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Vast can pull without GitHub credentials
        run: |
          docker logout ghcr.io
          docker pull ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-11
          docker pull ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-10
          docker pull ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-9
          docker pull ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-8
          docker pull ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-7
          docker pull ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-6
          docker pull ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-4
