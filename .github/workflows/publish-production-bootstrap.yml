name: Build Production-18 release candidate

on:
  push:
    branches: [production-18-build-rc3]
    paths:
      - "production-bootstrap/**"
      - ".github/workflows/publish-production-bootstrap.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable RC tag after tests
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: production-18-rc
  cancel-in-progress: false

jobs:
  test-build-and-optionally-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install video test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run contract and unit tests
        run: bash production-bootstrap/test_static.sh
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in only when publishing
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable release candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: production-bootstrap
          file: production-bootstrap/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.publish }}
          tags: ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-18-rc2-${{ github.sha }}
          cache-from: type=gha,scope=production-18
          cache-to: type=gha,mode=max,scope=production-18
          provenance: true
          sbom: true
      - name: Verify anonymous pull of published RC
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          docker logout ghcr.io
          docker pull ghcr.io/aryedu110-cmd/arye-vast-mobile-health:ltx25-production-18-rc2-${{ github.sha }}
