name: Publish Vast Docker image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.vast"
      - ".dockerignore"
      - "docker/**"
      - "scripts/**"
      - "*.py"
      - "*.sh"
      - "requirements-ui.txt"
      - "model_manifest.json"
      - ".github/workflows/publish-vast-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-vast-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate package
        run: |
          bash -n onstart.sh launch.sh scripts/*.sh docker/*.sh
          python3 -m py_compile app.py backend.py scripts/*.py tests/*.py
          python3 -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vast
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/aryedu110-cmd/arye-vast-mobile-ai-stack:1.2
            ghcr.io/aryedu110-cmd/arye-vast-mobile-ai-stack:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

